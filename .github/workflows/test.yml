name: test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm coverage

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: guest-agent/go.mod
          cache-dependency-path: guest-agent/go.sum

      - name: Go vet
        working-directory: guest-agent
        run: go vet ./...

      - name: Go test
        working-directory: guest-agent
        run: go test ./...

      - name: Go cross-compile (windows/amd64)
        working-directory: guest-agent
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o crucible-guest-agent.exe ./cmd/crucible-guest-agent
