name: test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: E2E
        run: pnpm e2e

      - name: Coverage
        run: pnpm coverage

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: guest-agent/go.mod
          cache-dependency-path: guest-agent/go.sum

      - name: Go vet
        working-directory: guest-agent
        run: go vet ./...

      - name: Go test
        working-directory: guest-agent
        run: go test ./...

      - name: Go cross-compile (windows/amd64)
        working-directory: guest-agent
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o crucible-guest-agent.exe ./cmd/crucible-guest-agent
