name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: guest-agent/go.mod
          cache-dependency-path: guest-agent/go.sum

      - name: Check
        run: pnpm check

      - name: Build release payload
        run: CRUCIBLE_VERSION=${GITHUB_REF_NAME#v} scripts/package-release.sh

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Select npm dist tag
        id: dist-tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=${VERSION#*-}" | sed 's/[.].*//' >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes
